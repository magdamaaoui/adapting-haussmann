<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housing & Heat Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ---------------------------------------------------------------
     Tokens — light is the base; dark redefines only these values.
     --------------------------------------------------------------- */
  :root{
    --bg:#f1ece1;
    --surface:#ffffff;
    --surface-2:#e9e0cd;
    --ink:#26221b;
    --ink-soft:#6b6353;
    --border:#d9cfb5;
    --border-soft:#e6dcc6;
    --accent:#43635a;
    --accent-ink:#ffffff;
    --accent-soft:#e2ebe6;
    --tag-fr-bg:#f4ded0; --tag-fr-ink:#7d4019;
    --tag-eu-bg:#dbe6e2; --tag-eu-ink:#2b4d44;
    --tag-gl-bg:#e6e0d0; --tag-gl-ink:#544b2d;
    --warn-bg:#f7e7cf; --warn-ink:#6d4a1b; --warn-border:#d3b071;
    --shadow-sm: 0 1px 2px rgba(38,34,27,0.06);
    --shadow: 0 1px 2px rgba(38,34,27,0.07), 0 8px 24px -16px rgba(38,34,27,0.4);
    --radius:13px;
    --focus:#1d5f6d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150f;
      --surface:#201d16;
      --surface-2:#262218;
      --ink:#ece6d7;
      --ink-soft:#b2a892;
      --border:#3a3526;
      --border-soft:#2f2b1f;
      --accent:#8fb7a9;
      --accent-ink:#0f1512;
      --accent-soft:#1d2b26;
      --tag-fr-bg:#3a2416; --tag-fr-ink:#eba876;
      --tag-eu-bg:#1c2c27; --tag-eu-ink:#9bcabd;
      --tag-gl-bg:#2a2618; --tag-gl-ink:#cabf99;
      --warn-bg:#302511; --warn-ink:#e6bb70; --warn-border:#5c471f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 24px -16px rgba(0,0,0,0.8);
      --focus:#7fd4e4;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17150f;
    --surface:#201d16;
    --surface-2:#262218;
    --ink:#ece6d7;
    --ink-soft:#b2a892;
    --border:#3a3526;
    --border-soft:#2f2b1f;
    --accent:#8fb7a9;
    --accent-ink:#0f1512;
    --accent-soft:#1d2b26;
    --tag-fr-bg:#3a2416; --tag-fr-ink:#eba876;
    --tag-eu-bg:#1c2c27; --tag-eu-ink:#9bcabd;
    --tag-gl-bg:#2a2618; --tag-gl-ink:#cabf99;
    --warn-bg:#302511; --warn-ink:#e6bb70; --warn-border:#5c471f;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 24px -16px rgba(0,0,0,0.8);
    --focus:#7fd4e4;
  }

  /* ---------------------------------------------------------------
     Base
     --------------------------------------------------------------- */
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px; margin:0 auto; padding:44px 24px 96px;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px;}
  /* Headings receive focus programmatically on route change (for screen readers);
     they are never tab targets, so they should not show a focus ring. */
  [tabindex="-1"]:focus, [tabindex="-1"]:focus-visible{outline:none;}
  [hidden]{display:none !important;}

  .skip{
    position:absolute; left:-9999px; top:0;
    background:var(--accent); color:var(--accent-ink);
    padding:10px 16px; border-radius:0 0 8px 0; z-index:50;
    font-size:14px;
  }
  .skip:focus{left:0;}
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }

  h1,h2,h3{font-family:"Fraunces", Georgia, serif; letter-spacing:-0.01em; text-wrap:balance;}
  h1{font-weight:600; font-size:clamp(29px,4vw,41px); line-height:1.08; margin:0 0 16px;}
  h2{font-weight:600; font-size:23px; margin:0;}
  h3{font-weight:600; font-size:16px; margin:0 0 10px;}

  .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--accent); margin:0 0 14px;
  }
  .lede{font-size:16.5px; color:var(--ink-soft); max-width:66ch; margin:0 0 10px;}

  /* ---------------------------------------------------------------
     Index — controls
     --------------------------------------------------------------- */
  .controls{
    position:sticky; top:0; z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    margin:32px 0 40px;
    padding:18px 0 14px;
  }
  .searchrow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px;}
  .search{
    flex:1 1 260px; min-width:0;
    font-family:"Public Sans", sans-serif; font-size:14.5px;
    color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:9px;
    padding:9px 13px;
  }
  .search::placeholder{color:var(--ink-soft);}
  .count{
    font-family:"IBM Plex Mono", monospace; font-size:12px;
    color:var(--ink-soft); white-space:nowrap; flex:none;
  }
  .filters{display:flex; flex-wrap:wrap; gap:7px;}
  .pill{
    font-family:"IBM Plex Mono", monospace; font-size:12px;
    color:var(--ink-soft); background:var(--surface);
    border:1px solid var(--border); border-radius:100px;
    padding:6px 12px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pill:hover{border-color:var(--accent); color:var(--accent);}
  .pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* ---------------------------------------------------------------
     Index — sections & cards
     --------------------------------------------------------------- */
  .topic{margin-top:52px;}
  .topic:first-of-type{margin-top:0;}
  .topic-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .topic-num{font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--accent);}
  .topic-note{color:var(--ink-soft); font-size:14.5px; max-width:70ch; margin:8px 0 20px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:15px;}

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:17px 18px 15px;
    box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:9px;
    text-decoration:none; color:inherit;
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow);}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-name{display:block; font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:16.5px; line-height:1.25;}
  .card-org{display:block; font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .card-sum{font-size:13.3px; color:var(--ink-soft); flex:1;}
  .card-foot{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px;
    color:var(--ink-soft); border-top:1px solid var(--border-soft);
    padding-top:8px; display:flex; justify-content:space-between; gap:10px;
  }
  .card:hover .card-foot .go{color:var(--accent);}
  .go::after{content:" →";}

  .tag{
    font-family:"IBM Plex Mono", monospace; font-size:10.5px;
    letter-spacing:.04em; text-transform:uppercase;
    padding:4px 8px; border-radius:6px; white-space:nowrap; flex:none;
  }
  .tag-fr{background:var(--tag-fr-bg); color:var(--tag-fr-ink);}
  .tag-eu{background:var(--tag-eu-bg); color:var(--tag-eu-ink);}
  .tag-gl{background:var(--tag-gl-bg); color:var(--tag-gl-ink);}
  .tag-closed{background:var(--warn-bg); color:var(--warn-ink);}
  .tag-open{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);}

  .howto{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:17px 21px; margin:24px 0 4px;
    box-shadow:var(--shadow-sm); font-size:14.5px;
  }
  .howto ul{margin:9px 0 0; padding-left:20px;}
  .howto li{margin-bottom:4px;}

  .empty{
    border:1px dashed var(--border); border-radius:var(--radius);
    padding:34px 20px; text-align:center; color:var(--ink-soft); font-size:14.5px;
  }

  /* ---------------------------------------------------------------
     Detail view
     --------------------------------------------------------------- */
  .back{
    display:inline-block; font-family:"IBM Plex Mono", monospace;
    font-size:12.5px; color:var(--accent); text-decoration:none; margin-bottom:22px;
  }
  .back:hover{text-decoration:underline;}
  .back::before{content:"← ";}

  .detail-head{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap; margin-bottom:6px;}
  .detail-title{font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:clamp(25px,3.4vw,34px); line-height:1.12; margin:0;}
  .detail-org{color:var(--ink-soft); font-size:14.5px; margin:6px 0 18px;}
  .detail-tags{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px;}

  .detail-cols{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:28px; align-items:start;}
  @media (max-width:820px){ .detail-cols{grid-template-columns:1fr;} }

  .facts{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 18px; margin:0 0 22px;
    display:grid; grid-template-columns:auto 1fr; gap:8px 16px;
    font-size:13px; box-shadow:var(--shadow-sm);
  }
  .facts dt{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px;
    color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;
    padding-top:1px;
  }
  .facts dd{margin:0; font-variant-numeric:tabular-nums;}

  .block{margin-bottom:26px;}
  .block p{margin:0 0 10px; font-size:15px; max-width:68ch;}
  .block ul{margin:0; padding-left:19px; font-size:14.5px; max-width:68ch;}
  .block li{margin-bottom:7px;}
  .block li::marker{color:var(--accent);}

  .caveats li::marker{color:var(--warn-border);}

  .rail{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm);
    position:sticky; top:24px;
  }
  .rail h3{font-size:14px; margin-bottom:12px;}
  .btn{
    display:block; text-align:center; text-decoration:none;
    background:var(--accent); color:var(--accent-ink);
    font-family:"IBM Plex Mono", monospace; font-size:12.5px;
    padding:11px 14px; border-radius:9px; margin-bottom:8px;
    transition:opacity .15s ease;
  }
  .btn:hover{opacity:.88;}
  .btn-note{font-size:11.5px; color:var(--ink-soft); font-family:"IBM Plex Mono", monospace; text-align:center; margin:0 0 18px;}
  .rail-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
  .rail-list a{font-size:13.5px; text-decoration:none; display:block; line-height:1.35;}
  .rail-list a:hover{color:var(--accent); text-decoration:underline;}
  .rail-list .ro{display:block; font-size:11.5px; color:var(--ink-soft); font-family:"IBM Plex Mono", monospace;}
  .rail-sep{border:none; border-top:1px solid var(--border-soft); margin:18px 0;}

  .warnbox{
    background:var(--warn-bg); border:1px solid var(--warn-border); color:var(--warn-ink);
    border-radius:12px; padding:14px 18px; font-size:13.8px; margin:0 0 22px; max-width:68ch;
  }
  .callout{
    background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:12px; padding:15px 19px; font-size:14px; margin:4px 0 22px;
  }

  footer{
    margin-top:70px; padding-top:20px; border-top:1px solid var(--border);
    font-size:12.5px; color:var(--ink-soft);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important;}
    .card:hover{transform:none;}
  }

  @media print{
    .controls, .rail, .back, .skip{display:none !important;}
    .card{break-inside:avoid;}
    body{background:#fff; color:#000;}
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* =============================================================
     1. CONTENT MODEL
     Every view on this page is rendered from these two arrays.
     ============================================================= */

  var TOPICS = [
    { id:"heat", num:"01", label:"Urban heat & thermal comfort",
      note:"Heat-island layers built for Paris specifically, plus the wider French heat-monitoring landscape." },
    { id:"air", num:"02", label:"Air quality",
      note:"Heat and air pollution compound each other — relevant for any project looking at multiple exposure alongside thermal comfort." },
    { id:"green", num:"03", label:"Green infrastructure & urban greening",
      note:"The mitigation side of the heat question — tree cover, canopy, and rooftop greening, the layers a pre/post-greening comparison needs." },
    { id:"housing", num:"04", label:"Housing conditions & energy poverty",
      note:"Building-level energy performance, and the households that cannot afford to escape indoor heat or cold." },
    { id:"people", num:"05", label:"Aging & vulnerable populations",
      note:"Who is actually exposed. The nominative municipal heat registers are confidential — these are the open substitutes." },
    { id:"justice", num:"06", label:"Environmental justice & socioeconomic geography",
      note:"Whether heat, energy poverty, or pollution track existing inequities — the geography needed to test that." },
    { id:"health", num:"07", label:"Health outcomes",
      note:"The dependent variable, for any project arguing that housing or heat conditions actually affect health." },
    { id:"property", num:"08", label:"Property & housing markets",
      note:"Whether heat vulnerability, energy performance, or greening show up in what people pay." },
    { id:"global", num:"09", label:"Other geographies",
      note:"For work set outside Paris — consistent, worldwide-comparable sources for the same themes above." }
  ];

  var DATASETS = [

    /* ---------- 01 URBAN HEAT ---------- */
    {
      id:"mapuce", topic:"heat", geo:"fr",
      name:"Projet MApUCE", org:"CNRM / Météo-France (ANR project)",
      summary:"Local Climate Zone classification and modelled urban heat island intensity at building-block scale for French cities.",
      facts:{
        "Spatial unit":"Urban block / RSU (urban fabric unit)",
        "Coverage":"French agglomerations; ~45 modelled in the published set",
        "Time":"Project ran 2014–2018; GeoClimate successor is ongoing",
        "Format":"Shapefile / GeoPackage (vector polygons)",
        "Access":"Free; original web viewer offline"
      },
      about:"MApUCE coupled Météo-France's TEB (Town Energy Balance) urban climate model with building morphology derived from national databases to classify urban fabric into Local Climate Zones and simulate urban heat island intensity. It is the finest-grained heat layer available for French cities — far below what any national grid can resolve. The original interactive viewer (mapuce.orbisgis.org) is offline, but the GIS methodology is maintained as the open-source GeoClimate toolbox, which can regenerate LCZ classifications for any French commune from open building data.",
      goodFor:[
        "Differentiating heat exposure <em>within</em> a city, where an 8 km reanalysis grid is a single flat value",
        "Attaching a heat-island intensity value to individual buildings or parcels via spatial join",
        "Characterising urban form (compactness, height, imperviousness) alongside temperature"
      ],
      watchOut:[
        "These are <strong>modelled</strong> values, not measurements — validate against station or satellite data before making strong claims",
        "The original portal is down, so document your provenance carefully for a reviewer",
        "The building inputs have a vintage; recent construction may be missing"
      ],
      howTo:[
        "Obtain the shapefile from the project distribution, or regenerate with GeoClimate",
        "Reproject to Lambert-93 (EPSG:2154) to match French administrative layers",
        "Spatial-join to your building, IRIS, or commune layer — area-weight if aggregating up"
      ],
      related:["ipr-chaleur","modis-lst","safran"],
      link:{ href:"https://www.umr-cnrm.fr/ville.climat/spip.php?rubrique120", label:"CNRM project page" }
    },
    {
      id:"ipr-chaleur", topic:"heat", geo:"fr",
      name:"Chaleur sur la ville", org:"Institut Paris Region",
      summary:"Interactive mapping of heat exposure and vulnerability across the Paris region.",
      facts:{
        "Spatial unit":"City block, Île-de-France",
        "Coverage":"Île-de-France region",
        "Time":"Current climate, with projection layers",
        "Format":"Web viewer; some layers downloadable",
        "Access":"Free, no account"
      },
      about:"The Institut Paris Region's public heat viewer combines modelled urban heat island intensity, land cover, and vulnerability indicators across Île-de-France. It is the practical cross-check for anyone working with a modelled heat layer over Paris: if your overlay disagrees sharply with this map, something is wrong with your join or projection.",
      goodFor:[
        "Sanity-checking a heat-island overlay before building analysis on top of it",
        "Communicating exposure patterns to a non-technical audience",
        "Seeing heat alongside the region's own vulnerability framing"
      ],
      watchOut:[
        "Primarily a viewer — bulk download availability varies layer by layer",
        "Regional scope: Île-de-France only"

      howTo:[
        "Browse the viewer to locate the layer you need",
        "Check the Institut Paris Region open data catalogue for a downloadable version, or contact them for the underlying raster"
      ],
      related:["mapuce","apur-vegetation","modis-lst"],
      link:{ href:"https://www.institutparisregion.fr/environnement/changement-climatique/chaleur-sur-la-ville/", label:"Interactive heat map" }
    },
    {
      id:"safran", topic:"heat", geo:"fr",
      name:"SAFRAN / SIM2 reanalysis", org:"Météo-France",
      summary:"France's own 8 km gridded surface reanalysis — the standard national temperature series since 1958.",
      facts:{
        "Resolution":"8 km regular grid, metropolitan France",
        "Coverage":"1958 – present",
        "Time step":"Daily (hourly for some variables)",
        "Format":"CSV series + GeoPackage grid geometry",
        "Access":"Free via data.gouv.fr / DRIAS"
      },
      about:"SAFRAN blends station observations with model output to produce continuous surface fields — temperature, precipitation, wind, humidity, radiation — over the whole of metropolitan France. SIM2 adds soil and hydrological outputs. It is the backbone of French climate-impact work, and the source from which SDES builds the national degree-day (DJU) series used to weather-correct energy consumption.",
      goodFor:[
        "Commune-level temperature series anywhere in France, including rural areas with no nearby station",
        "Degree-day and heating/cooling demand calculations on a consistent national basis",
        "Long-run trend analysis — nearly seven decades of continuous record"
      ],
      watchOut:[
        "8 km cells cannot resolve intra-urban heat islands: all of central Paris falls in a handful of cells",
        "The grid is not an administrative geography — area-weight when aggregating to communes or IRIS",
        "Reanalysis blends model and observation; it is not a pure measurement record"
      ],
      howTo:[
        "Download the SIM2 daily series for the variables and period you need",
        "Download the SAFRAN grid GeoPackage for the cell geometry",
        "Join series to geometry on cell ID, then area-weight onto your administrative units"
      ],
      related:["mf-stations","era5-land","mapuce"],
      link:{ href:"https://recherche.data.gouv.fr/fr/jeu-de-donnee/geopackage-des-mailles-safran-meteo-france-en-france-metropolitaine-integrant-des-variables-administratives-agricoles-et-hydriques", label:"SAFRAN grid GeoPackage" }
    },
    {
      id:"mf-stations", topic:"heat", geo:"fr",
      name:"Données climatologiques de base", org:"Météo-France — Données Publiques",
      summary:"Official ground-station records: hourly, daily and monthly, free and openly licensed.",
      facts:{
        "Spatial unit":"Weather stations (point), ~3,500 across France",
        "Coverage":"Varies by station; long series reach into the early 20th century",
        "Time step":"6-minute, hourly, daily, monthly products",
        "Format":"CSV",
        "Access":"Free, open licence"
      },
      about:"The raw observational backbone: temperature, precipitation, wind, humidity and more, recorded at Météo-France's station network. Everything gridded for France ultimately traces back to these records, which makes them the right choice when you need ground truth rather than a modelled surface.",
      goodFor:[
        "Validating a gridded or modelled product against real observations",
        "Hourly detail — night-time minimum temperatures during heat episodes, for example",
        "Documenting a specific heatwave episode with defensible primary data"
      ],
      watchOut:[
        "Station density is uneven and generally poor inside dense urban fabric",
        "Station relocations and instrument changes create breaks in long series — check metadata before trend analysis",
        "Point data: you must interpolate before you have a surface"
      ],
      howTo:[
        "Choose the product (horaires / quotidiennes / mensuelles) matching your time step",
        "Download by department, then filter to the stations near your study area",
        "Join to station coordinates from the accompanying station list"
      ],
      related:["safran","eobs","geodair"],
      link:{ href:"https://donneespubliques.meteofrance.fr/?fond=produit&id_produit=111&id_rubrique=37", label:"Données quotidiennes" }
    },
    {
      id:"h3sensing", topic:"heat", geo:"fr",
      name:"H3Sensing", org:"Apur (research project)",
      summary:"Sensing study measuring how heatwaves actually affect Greater Paris residents.",
      facts:{
        "Type":"Research project / sensor campaign",
        "Coverage":"Grand Paris",
        "Output":"Published findings and methodology",
        "Access":"Free to read"
      },
      about:"Apur's H3Sensing project measured heatwave impacts on residents of the Paris metropolitan area, linking environmental sensing with health and housing conditions. Its value here is methodological: it is a worked example of turning an abstract heat-island layer into a claim about people, in exactly the geography most Paris projects work in.",
      goodFor:[
        "A methodological template for designing your own exposure or vulnerability metric",
        "Citing an empirical Paris-specific link between heat and resident health",
        "Grounding a modelling exercise in fieldwork someone has actually done"
      ],
      watchOut:[
        "This is a project with published outputs, not an open dataset — do not plan on downloading a series"
      ],
      howTo:[
        "Read the project page and its linked publications",
        "Contact Apur if you need underlying measurements rather than published results"
      ],
      related:["mapuce","spf-canicule","ipr-chaleur"],
      link:{ href:"https://www.apur.org/en/our-works/h3sensing-research-project-measuring-impact-heatwaves-health-greater-paris-grand-paris-inhabitants", label:"Apur — H3Sensing" }
    },

    /* ---------- 02 AIR QUALITY ---------- */
    {
      id:"geodair", topic:"air", geo:"fr",
      name:"Geod'air", org:"LCSQA / Ineris — national platform",
      summary:"France's national reference platform for regulatory air-quality data, with a public API.",
      facts:{
        "Spatial unit":"Regulatory monitoring stations, nationwide",

        "Future-scenario framing on the same grid as the historical baseline",
        "A quick global baseline with no account or API to configure"
      ],
      watchOut:[
        "A downscaled product — it inherits the biases of its input reanalysis",
        "The core product is climatology, not a live series; do not use it for a specific heat episode",
        "Global GeoTIFFs are large; clip before you analyse"
      ],
      howTo:[
        "Download the variable and period from the CHELSA site",
        "Clip to your study area first, then run zonal statistics"
      ],
      related:["era5-land","modis-lst"],
      link:{ href:"https://www.chelsa-climate.org/", label:"chelsa-climate.org" }
    },
    {
      id:"eurostat-cross", topic:"global", geo:"eu",
      name:"Eurostat cross-cutting indicators", org:"Eurostat",
      summary:"Degree days, house prices, housing-cost overburden and energy poverty in one comparable system.",
      facts:{
        "Spatial unit":"Country and NUTS2",
        "Coverage":"Varies by indicator; most run 2000s – present",
        "Key tables":"nrg_chdd (degree days), house price index, housing-cost overburden, ilc_mdes01",
        "Format":"TSV / CSV / SDMX API",
        "Access":"Free, no account"
      },
      about:"For a European case study outside France, Eurostat is the one place where climate demand, housing costs and deprivation indicators are all defined the same way across countries. The trade-off is granularity: comparability is bought at national or NUTS2 level.",
      goodFor:[
        "Any cross-country European comparison where definitions must match",
        "Heating and cooling degree days without processing gridded climate data",
        "Housing-cost and deprivation context alongside climate exposure"
      ],
      watchOut:[
        "Country / NUTS2 only — never city-level",
        "Eurostat definitions often differ from the national statistics of the same country; do not mix them in one series",
        "Degree days use a fixed base temperature that may not suit your building stock"
      ],
      howTo:[
        "Find the table code, filter in the databrowser, export CSV",
        "Or query the SDMX API by table code for a reproducible pull"
      ],
      related:["eurostat-warm","dvf"],
      link:{ href:"https://ec.europa.eu/eurostat/web/housing-price-statistics", label:"Eurostat housing statistics" }
    },
    {
      id:"oecd-who", topic:"global", geo:"gl",
      name:"OECD & WHO indicators", org:"OECD / WHO Europe",
      summary:"Country-level health and wellbeing indicators for framing outside Europe.",
      facts:{
        "Spatial unit":"Country",
        "Coverage":"Most OECD and WHO European members",
        "Attributes":"Health outcomes, housing quality, wellbeing dimensions",
        "Format":"Web tools, CSV, APIs",
        "Access":"Free"
      },
      about:"When a case study sits outside Europe, these are the fallback for internationally comparable health and wellbeing context — broad rather than deep, but consistently defined across many countries.",
      goodFor:[
        "International framing for a non-European case study",
        "Placing one country's housing or health situation in a comparative range",
        "Accessible indicators for a general-audience report"
      ],
      watchOut:[
        "Country-level only — no sub-national resolution",
        "Underlying national definitions still vary despite harmonisation efforts",
        "Update cadence differs by indicator; check the reference year"
      ],
      howTo:[
        "Select indicators and countries in the web tool",
        "Export and note the reference year for each series"
      ],
      related:["eurostat-cross"],
      link:{ href:"http://www.oecdbetterlifeindex.org/", label:"OECD Better Life Index" }
    }
  ];

  /* =============================================================
     2. HELPERS
     ============================================================= */

  var GEO_LABEL = { fr:"France", eu:"EU", gl:"Global" };
  var BASE_TITLE = "Housing & Heat Data";
  var byId = {};
  var byTopic = {};

  DATASETS.forEach(function (d) {
    byId[d.id] = d;
    (byTopic[d.topic] = byTopic[d.topic] || []).push(d);
  });

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Card summaries and list items may contain deliberate inline markup
     (<strong>, <em>) authored here — allow those, escape everything else. */
  function rich(s) {
    return esc(s)
      .replace(/&lt;(\/?)(strong|em)&gt;/g, "<$1$2>");
  }

  function topicById(id) {
    for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === id) return TOPICS[i];
    return null;
  }

  function tagFor(d) {
    return '<span class="tag tag-' + d.geo + '">' + GEO_LABEL[d.geo] + '</span>';
  }

  var main = document.getElementById("main");

  /* =============================================================
     3. INDEX VIEW
     ============================================================= */

  var state = { topic: "all", query: "" };

  function matches(d, q) {
    if (!q) return true;
    var hay = (d.name + " " + d.org + " " + d.summary + " " + topicById(d.topic).label).toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (t) { return hay.indexOf(t) !== -1; });
  }

  function cardHTML(d) {
    return '' +
      '<a class="card" href="#/d/' + esc(d.id) + '">' +
        '<span class="card-head">' +
          '<span>' +
            '<span class="card-name">' + esc(d.name) + '</span>' +
            '<span class="card-org">' + esc(d.org) + '</span>' +
          '</span>' +
          tagFor(d) +
        '</span>' +
        '<span class="card-sum">' + rich(d.summary) + '</span>' +
        '<span class="card-foot">' +
          '<span>' + (d.closed ? "Not open data" : esc(firstFact(d))) + '</span>' +
          '<span class="go">Details</span>' +
        '</span>' +
      '</a>';
  }

  function firstFact(d) {
    var keys = Object.keys(d.facts);
    for (var i = 0; i < keys.length; i++) {
      if (/resolution|spatial unit|type/i.test(keys[i])) return d.facts[keys[i]];
    }
    return d.facts[keys[0]];
  }

  function renderIndex() {
    var q = state.query.trim();
    var shown = 0;
    var sections = "";

    TOPICS.forEach(function (t) {
      if (state.topic !== "all" && state.topic !== t.id) return;
      var items = (byTopic[t.id] || []).filter(function (d) { return matches(d, q); });
      if (!items.length) return;
      shown += items.length;
      sections += '' +
        '<section class="topic" aria-labelledby="h-' + t.id + '">' +
          '<div class="topic-head">' +
            '<span class="topic-num">' + t.num + '</span>' +
            '<h2 id="h-' + t.id + '">' + esc(t.label) + '</h2>' +
          '</div>' +
          '<p class="topic-note">' + esc(t.note) + '</p>' +
          '<div class="grid">' + items.map(cardHTML).join("") + '</div>' +
        '</section>';
    });

    if (!shown) {
      sections = '<div class="empty"><p>No datasets match that search.</p>' +
                 '<button class="pill" type="button" data-reset="1">Clear filters</button></div>';
    }

    main.innerHTML = '' +
      '<p class="eyebrow">Reference · Data for housing, heat &amp; health research</p>' +
      '<h1 tabindex="-1">Housing, heat &amp; health data</h1>' +
      '<p class="lede">A working repository of datasets spanning housing conditions, urban heat, and population health — ' +
        'anchored in Paris and France, with a closing section for work set elsewhere. ' +
        'Each entry has its own page covering resolution, coverage, caveats and how to get it.</p>' +

      '<div class="howto">' +
        '<h3>How to use this page</h3>' +
        '<ul>' +
          '<li>Search or filter by theme, then open any dataset for the full brief.</li>' +
          '<li>Most entries are point data or regular grids, not administrative boundaries — budget time for a join or interpolation step.</li>' +
          '<li>Every detail page lists what the source is genuinely good for, and where it will mislead you if used carelessly.</li>' +
        '</ul>' +
      '</div>' +

      '<div class="controls">' +
        '<div class="searchrow">' +
          '<label class="sr-only" for="q">Search datasets</label>' +
          '<input id="q" class="search" type="search" placeholder="Search datasets, agencies, themes… (press /)" ' +
            'value="' + esc(state.query) + '" autocomplete="off">' +
          '<span class="count" role="status" aria-live="polite">' + shown + ' of ' + DATASETS.length + '</span>' +
        '</div>' +
        '<div class="filters" role="group" aria-label="Filter by theme">' +
          pillHTML("all", "All") +
          TOPICS.map(function (t) { return pillHTML(t.id, shortLabel(t.label)); }).join("") +
        '</div>' +
      '</div>' +

      sections;

    wireIndex();
  }

  function shortLabel(label) {
    return label.split(" & ")[0].replace(" and ", " & ");
  }

  function pillHTML(id, label) {
    var on = state.topic === id;
    return '<button class="pill" type="button" data-topic="' + esc(id) + '" aria-pressed="' + on + '">' +
      esc(label) + '</button>';
  }

  function wireIndex() {
    var input = document.getElementById("q");
    if (input) {
      input.addEventListener("input", function () {
        state.query = input.value;
        var pos = input.selectionStart;
        renderIndex();
        var again = document.getElementById("q");
        again.focus();
        try { again.setSelectionRange(pos, pos); } catch (e) {}
      });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { state.query = ""; renderIndex(); document.getElementById("q").focus(); }
      });
    }

    main.querySelectorAll("[data-topic]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.topic = btn.getAttribute("data-topic");
        renderIndex();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    var reset = main.querySelector("[data-reset]");
    if (reset) reset.addEventListener("click", function () {
      state.topic = "all"; state.query = ""; renderIndex();
    });
  }

  /* =============================================================
     4. DETAIL VIEW
     ============================================================= */

  function listHTML(items, cls) {
    if (!items || !items.length) return "";
    return '<ul class="' + (cls || "") + '">' +
      items.map(function (i) { return "<li>" + rich(i) + "</li>"; }).join("") + "</ul>";
  }

  function renderDetail(id) {
    var d = byId[id];
    if (!d) return renderNotFound(id);
    var t = topicById(d.topic);

    var facts = Object.keys(d.facts).map(function (k) {
      return "<dt>" + esc(k) + "</dt><dd>" + rich(d.facts[k]) + "</dd>";
    }).join("");

    var related = (d.related || []).map(function (rid) {
      var r = byId[rid];
      if (!r) return "";
      return '<li><a href="#/d/' + esc(r.id) + '">' + esc(r.name) +
             '<span class="ro">' + esc(r.org) + '</span></a></li>';
    }).join("");

    main.innerHTML = '' +
      '<a class="back" href="#/t/' + esc(t.id) + '">' + esc(t.label) + '</a>' +

      '<div class="detail-head">' +
        '<h1 class="detail-title" tabindex="-1">' + esc(d.name) + '</h1>' +
      '</div>' +
      '<p class="detail-org">' + esc(d.org) + '</p>' +
      '<div class="detail-tags">' + tagFor(d) +
        '<span class="tag tag-' + (d.closed ? "closed" : "open") + '">' +
          (d.closed ? "Confidential" : "Open data") + '</span>' +
      '</div>' +

      (d.warn ? '<p class="warnbox">' + rich(d.warn) + '</p>' : "") +

      '<div class="detail-cols">' +
        '<div>' +
          '<dl class="facts">' + facts + '</dl>' +

          '<section class="block"><h3>What it is</h3><p>' + rich(d.about) + '</p></section>' +
          '<section class="block"><h3>Good for</h3>' + listHTML(d.goodFor) + '</section>' +
          '<section class="block"><h3>Watch out for</h3>' + listHTML(d.watchOut, "caveats") + '</section>' +
          '<section class="block"><h3>How to get it</h3>' + listHTML(d.howTo) + '</section>' +
        '</div>' +

        '<aside class="rail" aria-label="Source and related datasets">' +
          '<a class="btn" href="' + esc(d.link.href) + '" target="_blank" rel="noopener noreferrer">' +
            esc(d.link.label) + '</a>' +
          '<p class="btn-note">opens the official source</p>' +
          (related ? '<hr class="rail-sep"><h3>Related</h3><ul class="rail-list">' + related + '</ul>' : "") +
        '</aside>' +
      '</div>';

    document.title = d.name + " · " + BASE_TITLE;
  }

  function renderNotFound(id) {
    main.innerHTML =
      '<a class="back" href="#/">All datasets</a>' +
      '<h1 tabindex="-1">Not found</h1>' +
      '<p class="lede">No dataset with the identifier “' + esc(id) + '”. It may have been renamed.</p>';
  }

  /* =============================================================
     5. ROUTER
     ============================================================= */

  var lastIndexScroll = 0;

  function route() {
    var hash = location.hash.replace(/^#/, "");
    var parts = hash.split("/").filter(Boolean);   // ["d","safran"] | ["t","heat"] | []

    if (parts[0] === "d" && parts[1]) {
      renderDetail(parts[1]);
      window.scrollTo(0, 0);
    } else {
      if (parts[0] === "t" && parts[1] && topicById(parts[1])) {
        state.topic = parts[1];
      }
      renderIndex();
      document.title = BASE_TITLE;
      window.scrollTo(0, lastIndexScroll);
      lastIndexScroll = 0;
    }

    var h = main.querySelector("h1");
    if (h) h.focus({ preventScroll: true });
  }

  // Remember where we were on the index before opening a dataset.
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a.card") : null;
    if (a) lastIndexScroll = window.scrollY;
  }, true);

  // "/" focuses search from anywhere on the index.
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      var q = document.getElementById("q");
      if (q) { e.preventDefault(); q.focus(); q.select(); }
    }
  });

  window.addEventListener("hashchange", route);
  route();
})();
</script>

</body>
</html>
